# Render Blueprint — despliegue declarativo (Render > New > Blueprint, apunta a este repo)
# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: life-organizer-db
    databaseName: life_organizer
    plan: free
    postgresMajorVersion: "15"

services:
  - type: web
    name: life-organizer-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: life-organizer-db
          property: connectionString
      # El Postgres de Render (arriba) no tiene pooler delante, así que apunta a la misma BD que
      # DATABASE_URL. Hace falta porque el Dockerfile corre `prisma migrate deploy` en cada
      # arranque, y la CLI de Prisma usa DIRECT_URL para migrar (ver prisma/schema.prisma). Si en
      # vez del Postgres de Render usas uno externo con pooler (p.ej. Supabase), pon aquí a mano
      # la conexión DIRECTA (puerto 5432) y en DATABASE_URL la POOLED (puerto 6543) — ver
      # DEPLOYMENT.md#usar-supabase-como-postgres.
      - key: DIRECT_URL
        fromDatabase:
          name: life-organizer-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*" # cámbialo por el dominio real del dashboard en producción
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
